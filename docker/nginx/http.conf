# Plain-HTTP site (local development / behind another TLS proxy).
server_tokens off;
gzip on;
gzip_types text/css application/json text/csv application/javascript image/svg+xml;
gzip_min_length 1024;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    include /etc/nginx/conf.d/security-headers.inc;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ /\.(?!well-known) { deny all; }
    location /fig/  { expires 1h; }
    location /data/ { add_header Content-Disposition "attachment"; include /etc/nginx/conf.d/security-headers.inc; }
    location / { try_files $uri $uri/ =404; expires 5m; }
}
