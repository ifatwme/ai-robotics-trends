# Production: HTTP (ACME + health + redirect) and HTTPS. Mounted over default.conf by deploy/compose.server.yml.
server_tokens off;
gzip on;
gzip_types text/css application/json text/csv application/javascript image/svg+xml;
gzip_min_length 1024;

server {
    listen 8080;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; try_files $uri =404; }
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    include /etc/nginx/conf.d/security-headers.inc;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ /\.(?!well-known) { deny all; }
    location /fig/  { expires 1h; }
    location /data/ { add_header Content-Disposition "attachment"; include /etc/nginx/conf.d/security-headers.inc; }
    location / { try_files $uri $uri/ =404; expires 5m; }
}
