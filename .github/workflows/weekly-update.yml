name: Weekly update

on:
  schedule:
    - cron: "17 4 * * 1"          # every Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      window_end:
        description: "Exclusive end date YYYY-MM-DD (blank = today UTC)"
        required: false
        default: ""

permissions:
  contents: write                 # commit history/weekly_metrics.csv
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PIPELINE_IMAGE: aitrends-pipeline:ci
      WINDOW_END: ${{ inputs.window_end }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (~10 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4

      - name: Build pipeline image (layer-cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/pipeline.Dockerfile
          tags: ${{ env.PIPELINE_IMAGE }}
          load: true
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,scope=pipeline,mode=max

      - name: Restore ML caches (embeddings, sentiment, HF models)
        uses: actions/cache/restore@v6
        with:
          path: |
            data/emb_cache.pkl
            data/sent_cache.pkl
            cache/hf
          key: ml-${{ github.run_id }}
          restore-keys: ml-

      - name: Collect + analyse + render
        run: |
          mkdir -p data out site cache history
          export PIPELINE_UID=$(id -u) PIPELINE_GID=$(id -g)
          export OMP_NUM_THREADS=$(nproc)
          docker compose run --rm pipeline collect all

      - name: Save ML caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            data/emb_cache.pkl
            data/sent_cache.pkl
            cache/hf
          key: ml-${{ github.run_id }}

      - name: Commit weekly history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/weekly_metrics.csv
          git diff --cached --quiet || git commit -m "chore(data): weekly metrics for week ending $(date -u +%F)"
          git push

      - name: Keep run outputs (30 days)
        uses: actions/upload-artifact@v7
        with:
          name: analysis-output
          path: out/
          retention-days: 30

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
